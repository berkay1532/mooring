name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # `make build` builds the factory with `stellar contract build`, which is
      # required by its `experimental_spec_shaking_v2` feature, and the factory
      # `contractimport!`s the card wasm -- so the CLI is needed before tests.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install stellar CLI
        run: |
          cargo binstall --no-confirm stellar-cli \
            || cargo install --locked stellar-cli
          stellar --version

      - run: cargo fmt --all -- --check
      - run: make build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Bindings freshness: regenerate from the wasms just built and fail if
      # the committed TypeScript in packages/contracts-ts/src drifted.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: packages/contracts-ts/scripts/generate.sh
      - run: git diff --exit-code packages/contracts-ts/src

  scripts:
    runs-on: ubuntu-latest
    # Build + type-check only. Nothing here touches testnet.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    # Web app build + type-check + unit tests. Nothing here touches testnet.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w @mooring/contracts-ts -w @mooring/x402-client
      - run: npm run typecheck -w @mooring/web
      - run: npm test -w @mooring/web
      - name: next build
        run: |
          set -a
          source apps/web/.env.example
          set +a
          npm run build:web -w @mooring/web
